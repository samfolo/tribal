name: Docker

on:
  push:
    branches: ["**"]
    tags: ['**[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
    branches: [main]

# Default-deny at the workflow level so every future job must opt in to
# any capability beyond the implicit `metadata: read` grant — keeps a
# new job from silently inheriting the repo's default permissive token
# permissions if added without a job-level `permissions:` block.
permissions: {}

env:
  IMAGE_NAME: ghcr.io/tribal-memory/tribal

jobs:
  shellcheck:
    name: Shellcheck entrypoint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck scripts/tribal-entrypoint

  build-verify:
    name: Build image (verify) - ${{ matrix.platform }}
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          # build.rs derives `TRIBAL_GIT_DESCRIBE` from the working-tree git
          # state; fetch tags + history so the description is meaningful.
          fetch-depth: 0
      - name: Compute build version
        id: describe
        run: echo "value=$(git describe --always --dirty --tags)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TRIBAL_GIT_DESCRIBE=${{ steps.describe.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  validate-tag:
    name: Validate tag matches workspace version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Parse tag with metadata-action
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
      - name: Cross-check parsed version against workspace.package.version
        env:
          PARSED_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [[ -z "$PARSED_VERSION" ]]; then
            echo "::error::tag '${GITHUB_REF#refs/tags/}' did not parse as SemVer via docker/metadata-action"
            exit 1
          fi
          expected=$(cargo metadata --no-deps --format-version=1 \
            | jq -r '.packages[] | select(.name=="tribal") | .version')
          if [[ "$PARSED_VERSION" != "$expected" ]]; then
            echo "::error::tag SemVer '${PARSED_VERSION}' does not match workspace.package.version '${expected}'; bump Cargo.toml or retag"
            exit 1
          fi

  publish:
    name: Build and push - ${{ matrix.platform }}
    needs: [shellcheck, validate-tag]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          # build.rs derives `TRIBAL_GIT_DESCRIBE` from the working-tree git
          # state; fetch tags + history so the description is meaningful.
          fetch-depth: 0
      - name: Compute build version
        id: describe
        run: echo "value=$(git describe --always --dirty --tags)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TRIBAL_GIT_DESCRIBE=${{ steps.describe.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest artefact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: [shellcheck, validate-tag, publish]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${VERSION}" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"

  publish-mcp-registry:
    name: Publish to the MCP Registry
    needs: [validate-tag, merge]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The registry is in preview; never let a registry hiccup or a CLI
    # regression turn a successful build-and-push into a red tagged release.
    continue-on-error: true
    permissions:
      contents: read
      # OIDC lets mcp-publisher prove this repo owns the io.github.tribal-memory
      # namespace; no stored secret is needed.
      id-token: write
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      # Stamp the release version into the metadata so the registry entry can
      # never drift from the tag: server.version and the image tag in the OCI
      # identifier both follow VERSION. An OCI package must not carry a package
      # `version` field (the registry rejects it; the version lives in the
      # identifier tag). The committed identifier tag is just a default; this
      # overwrites it at publish time.
      - name: Stamp the release version into server.json
        run: |
          jq --arg v "$VERSION" '
            .version = $v
            | .packages[0].identifier |= sub(":[^:]+$"; ":\($v)")
          ' server.json > server.json.tmp && mv server.json.tmp server.json
          echo "Publishing at $VERSION:"; jq -r '.version, .packages[0].identifier' server.json
      - name: Install mcp-publisher
        run: |
          # Pinned, not `latest`: the CLI ships fast and a regression has broken
          # valid publishes before. Bump deliberately.
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate server.json
        run: ./mcp-publisher validate server.json
      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        # The registry pulls the public GHCR image to verify the ownership label,
        # so the package must stay public.
        run: ./mcp-publisher publish
