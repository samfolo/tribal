[package]
name = "tribal"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository = "https://github.com/tribal-memory/tribal"
homepage = "https://github.com/tribal-memory/tribal"
description = "Capture tribal knowledge. Give it to your agents."

[package.metadata.dist]
dist = true

[[bin]]
name = "tribal"
path = "src/main.rs"

[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"
required-features = ["test-helpers"]

[[test]]
name = "check"
path = "tests/check.rs"
required-features = ["test-helpers"]

[dependencies]
anstream.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
dashmap.workspace = true
fs2.workspace = true
getrandom.workspace = true
hmac.workspace = true
libc.workspace = true
dirs.workspace = true
gethostname.workspace = true
gix.workspace = true
http.workspace = true
http-body.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
path-clean.workspace = true
pin-project-lite.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
shellexpand.workspace = true
shlex.workspace = true
sqlx.workspace = true
strum.workspace = true
tera.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

tribal-agent-runtime.workspace = true
tribal-auth.workspace = true
tribal-common.workspace = true
tribal-config = { workspace = true, features = ["schema"] }
tribal-db.workspace = true
tribal-domain.workspace = true
tribal-inference.workspace = true
tribal-mcp.workspace = true
tribal-telemetry.workspace = true
tribal-ui.workspace = true
tribal-wire.workspace = true
tribal-worker.workspace = true

[features]
test-helpers = ["tribal-inference/test-helpers"]

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

tribal-inference = { workspace = true, features = ["test-helpers"] }
tribal-test-utils.workspace = true

[lints]
workspace = true
