gethostname.workspace = true
gix.workspace = true
http.workspace = true
http-body.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
pin-project-lite.workspace = true
rand.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde_json.workspace = true
shellexpand.workspace = true
sqlx.workspace = true
tera.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
uuid.workspace = true

tribal-common.workspace = true
tribal-config.workspace = true
tribal-db.workspace = true
tribal-domain.workspace = true
tribal-inference.workspace = true
tribal-mcp.workspace = true
tribal-telemetry.workspace = true
tribal-worker.workspace = true

[features]
