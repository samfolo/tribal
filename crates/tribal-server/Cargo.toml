[package]
name = "tribal"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository = "https://github.com/samfolo/tribal"
homepage = "https://github.com/samfolo/tribal"
description = "Capture tribal knowledge. Give it to your agents."

[package.metadata.dist]
dist = true

[[bin]]
name = "tribal"
path = "src/main.rs"

[[test]]
name = "bootstrap"
path = "tests/bootstrap.rs"
required-features = ["test-helpers"]

[dependencies]
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
dashmap.workspace = true
gethostname.workspace = true
gix.workspace = true
http.workspace = true
http-body.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
path-clean.workspace = true
pin-project-lite.workspace = true
rand.workspace = true
reqwest.workspace = true
rmcp.workspace = true
serde_json.workspace = true
shellexpand.workspace = true
sqlx.workspace = true
tera.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
uuid.workspace = true

tribal-common.workspace = true
tribal-config.workspace = true
tribal-db.workspace = true
tribal-domain.workspace = true
tribal-inference.workspace = true
tribal-mcp.workspace = true
tribal-telemetry.workspace = true
tribal-ui.workspace = true
tribal-worker.workspace = true

[features]
test-helpers = []

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

tribal-test-utils.workspace = true
