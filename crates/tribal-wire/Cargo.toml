[package]
name = "tribal-wire"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
schema = ["dep:schemars", "tribal-domain/schema"]

[dependencies]
chrono.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tribal-domain = { path = "../tribal-domain" }

[dev-dependencies]
# The golden-schema test generates schemas under the `schema` feature; it is
# gated on that feature, so schemars is unused when the feature is off.
schemars.workspace = true

[lints]
workspace = true
