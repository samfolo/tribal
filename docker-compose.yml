services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: tribal
      POSTGRES_PASSWORD: tribal
      POSTGRES_DB: tribal
    volumes:
      - tribal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tribal"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tribal:
    image: ghcr.io/tribal-memory/tribal:0.4.0
    depends_on:
      postgres:
        condition: service_healthy
    # The list form lets the optional agent budgets and the triage verifier
    # be bare host pass-throughs: forwarded only when the host sets them, so
    # an unset override stays the binary's default rather than an empty value
    # the config would reject.
    environment:
      - TRIBAL_DATABASE__URL=postgres://tribal:tribal@postgres:5432/tribal
      # http or sse — both accept a bind_address; stdio rejects it via
      # validate_server. Swap to sse here if you prefer the legacy transport.
      - TRIBAL_SERVER__TRANSPORT=http
      - TRIBAL_SERVER__BIND_ADDRESS=0.0.0.0:8725
      - TRIBAL_PUBLIC_MCP_URL=http://127.0.0.1:8725/mcp
      # Redirect tribal.yaml and credentials.json into the state volume so
      # they survive container restart. Resolves to
      # /var/lib/tribal/tribal/{tribal.yaml,credentials.json} (the inner
      # `tribal/` segment is the binary's own subdirectory under any
      # XDG_CONFIG_HOME parent).
      - XDG_CONFIG_HOME=/var/lib/tribal
      - TRIBAL_CONFIG_PATH=/var/lib/tribal/tribal/tribal.yaml
      # Provider selection. Defaults target a local Ollama on the host.
      # Every field is exposed as a host-overridable variable: Compose only
      # forwards variables it names here, so each needs a default to stay
      # overridable from .env. To use a cloud provider, set these in .env
      # (see .env.example for a ready-to-paste OpenAI block).
      #
      # base_url is pinned to host.docker.internal rather than the binary's
      # localhost default so the container reaches Ollama on the host;
      # extra_hosts (below) makes the name resolvable on Linux Docker
      # (macOS / Windows Docker Desktop resolve it natively). Switching a
      # stage to a cloud provider means overriding its base_url too (for
      # example https://api.openai.com or https://api.anthropic.com),
      # otherwise requests route to the local Ollama address. Model
      # defaults mirror the binary's.
      - TRIBAL_INIT__EMBEDDING__PROVIDER=${TRIBAL_INIT__EMBEDDING__PROVIDER:-ollama}
      - TRIBAL_INIT__EMBEDDING__MODEL=${TRIBAL_INIT__EMBEDDING__MODEL:-nomic-embed-text:v1.5}
      - TRIBAL_INIT__EMBEDDING__BASE_URL=${TRIBAL_INIT__EMBEDDING__BASE_URL:-http://host.docker.internal:11434}
      - TRIBAL_INFERENCE__EXTRACTION__PROVIDER=${TRIBAL_INFERENCE__EXTRACTION__PROVIDER:-ollama}
      - TRIBAL_INFERENCE__EXTRACTION__MODEL=${TRIBAL_INFERENCE__EXTRACTION__MODEL:-llama3.1:70b}
      - TRIBAL_INFERENCE__EXTRACTION__BASE_URL=${TRIBAL_INFERENCE__EXTRACTION__BASE_URL:-http://host.docker.internal:11434}
      - TRIBAL_INFERENCE__TRIAGE__PROVIDER=${TRIBAL_INFERENCE__TRIAGE__PROVIDER:-ollama}
      - TRIBAL_INFERENCE__TRIAGE__MODEL=${TRIBAL_INFERENCE__TRIAGE__MODEL:-llama3.1:8b}
      - TRIBAL_INFERENCE__TRIAGE__BASE_URL=${TRIBAL_INFERENCE__TRIAGE__BASE_URL:-http://host.docker.internal:11434}
      - TRIBAL_INFERENCE__RELATION__PROVIDER=${TRIBAL_INFERENCE__RELATION__PROVIDER:-ollama}
      - TRIBAL_INFERENCE__RELATION__MODEL=${TRIBAL_INFERENCE__RELATION__MODEL:-llama3.1:8b}
      - TRIBAL_INFERENCE__RELATION__BASE_URL=${TRIBAL_INFERENCE__RELATION__BASE_URL:-http://host.docker.internal:11434}
      # Opt-in agentic execution, per stage; the default reproduces the
      # launched one-shot behaviour exactly. Set a stage to loop to run its
      # in-process turn loop instead. The triage and relation loops carry a
      # verifier, on by default and disabled per stage with
      # TRIBAL_AGENTS__TRIAGE__VERIFIER=false or
      # TRIBAL_AGENTS__RELATION__VERIFIER=false; extraction has no verifier.
      - TRIBAL_AGENTS__EXTRACTION__EXECUTOR=${TRIBAL_AGENTS__EXTRACTION__EXECUTOR:-one_shot}
      - TRIBAL_AGENTS__TRIAGE__EXECUTOR=${TRIBAL_AGENTS__TRIAGE__EXECUTOR:-one_shot}
      - TRIBAL_AGENTS__RELATION__EXECUTOR=${TRIBAL_AGENTS__RELATION__EXECUTOR:-one_shot}
      # Optional overrides: the triage and relation verifier toggles and each
      # stage's turn, token, and deadline budgets. Bare pass-throughs, so an
      # unset one is omitted from the container and the binary's default
      # stands. Set any of them in .env to override (see .env.example).
      - TRIBAL_AGENTS__TRIAGE__VERIFIER
      - TRIBAL_AGENTS__RELATION__VERIFIER
      - TRIBAL_AGENTS__EXTRACTION__MAX_TURNS
      - TRIBAL_AGENTS__EXTRACTION__MAX_TOTAL_TOKENS
      - TRIBAL_AGENTS__EXTRACTION__EXECUTION_DEADLINE_SECONDS
      - TRIBAL_AGENTS__TRIAGE__MAX_TURNS
      - TRIBAL_AGENTS__TRIAGE__MAX_TOTAL_TOKENS
      - TRIBAL_AGENTS__TRIAGE__EXECUTION_DEADLINE_SECONDS
      - TRIBAL_AGENTS__RELATION__MAX_TURNS
      - TRIBAL_AGENTS__RELATION__MAX_TOTAL_TOKENS
      - TRIBAL_AGENTS__RELATION__EXECUTION_DEADLINE_SECONDS
      - TRIBAL_PROJECT_NAME=${TRIBAL_PROJECT_NAME:-tribal-docker-local}
      - TRIBAL_PROJECT_REMOTE=${TRIBAL_PROJECT_REMOTE:-https://example.com/local/tribal-docker.git}
      # Scopes container-side commands (the healthcheck and any
      # `docker compose exec tribal ...`) to the bootstrapped project. Leave
      # empty for the first `up`; once bootstrap prints the project id, set it
      # in .env so exec'd commands resolve that project instead of warning.
      # The server always serves the project recorded in the state volume, so
      # a stale value here cannot mis-scope serving.
      - TRIBAL_PROJECT_ID=${TRIBAL_PROJECT_ID:-}
      # Provider env vars passed through from the host shell. Optional;
      # required only for real ingest against the listed cloud providers.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - tribal_state:/var/lib/tribal
    entrypoint: ["/usr/local/bin/tribal-entrypoint"]
    ports:
      - "127.0.0.1:8725:8725"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "tribal", "check", "--json"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tribal_pgdata:
  tribal_state:
