[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "Pulled in transitively via sqlx-macros-core -> sqlx-mysql for compile-time query checking. We only use postgres; this dependency is not part of our runtime artifacts." },
]
