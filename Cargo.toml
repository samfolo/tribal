[workspace]
resolver = "3"
members = [
    "crates/tribal-common",
    "crates/tribal-domain",
    "crates/tribal-db",
    "crates/tribal-inference",
    "crates/tribal-worker",
    "crates/tribal-mcp",
    "crates/tribal-telemetry",
    "crates/tribal-config",
    "crates/tribal-server",
    "crates/tribal-test-utils",
    "crates/tribal-e2e",
    "crates/tribal-ui",
]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "Elastic-2.0"
rust-version = "1.93"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = "0.8"
bytes = "1"
http = "1"
http-body = "1"
pin-project-lite = "0.2"
tower = { version = "0.5", features = ["util"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Observability
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "http-proto", "metrics"] }
opentelemetry-proto = { version = "0.31", features = ["gen-tonic-messages", "with-serde", "trace"] }
opentelemetry-semantic-conventions = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["metrics", "rt-tokio"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Builders
typed-builder = "0.23"

# Enum utilities
strum = { version = "0.28", features = ["derive"] }

# Hashing
fnv = "1"
sha2 = "0.10"

# Encoding
base64 = "0.22"

# Ordered collections
indexmap = "2"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# URL parsing
url = "2"

# Cancellation and utilities
tokio-util = "0.7"

# Concurrent maps
dashmap = "6"

# Async traits
async-trait = "0.1"

# Template rendering
tera = "1"

# JSON Schema generation
schemars = { version = "0.8", features = ["uuid1"] }

# MCP server
rmcp = { version = "1", features = ["macros", "server", "client", "transport-io", "transport-async-rw", "transport-streamable-http-server"] }

# Macro utilities
pastey = "0.2"

# File watching
notify = "8"
notify-debouncer-mini = "0.7"

# Configuration
figment = { version = "0.10", features = ["yaml", "env"] }
path-clean = "1"
shellexpand = "3"
dirs = "6"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env", "suggestions"] }

# CLI presentation
anstream = "1"
anstyle = "1"
chrono-humanize = "0.2"
crossterm = "0.29"
owo-colors = "4"
supports-color = "3"
termbg = "0.6"
textwrap = "0.16"
unicode-segmentation = "1.13"
unicode-width = "0.2"

# System information
gethostname = "1"

# Git repository introspection
gix = { version = "0.80", default-features = false }

# Random number generation
rand = "0.10"

# Testing
tempfile = "3"
testcontainers = "0.27"
wiremock = "0.6"

# Internal crates
tribal = { path = "crates/tribal-server" }

tribal-common = { path = "crates/tribal-common" }
tribal-config = { path = "crates/tribal-config" }
tribal-db = { path = "crates/tribal-db" }
tribal-domain = { path = "crates/tribal-domain" }
tribal-inference = { path = "crates/tribal-inference" }
tribal-mcp = { path = "crates/tribal-mcp" }
tribal-telemetry = { path = "crates/tribal-telemetry" }
tribal-test-utils = { path = "crates/tribal-test-utils" }
tribal-ui = { path = "crates/tribal-ui" }
tribal-worker = { path = "crates/tribal-worker" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
