[workspace]
resolver = "3"
members = [
    "crates/tribal-domain",
    "crates/tribal-db",
    "crates/tribal-inference",
    "crates/tribal-worker",
    "crates/tribal-mcp",
    "crates/tribal-telemetry",
    "crates/tribal-server",
    "crates/tribal-test-utils",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
pgvector = "0.4"

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Observability
tracing = "0.1"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Internal crates
tribal-domain = { path = "crates/tribal-domain" }
tribal-db = { path = "crates/tribal-db" }
tribal-inference = { path = "crates/tribal-inference" }
tribal-worker = { path = "crates/tribal-worker" }
tribal-mcp = { path = "crates/tribal-mcp" }
tribal-telemetry = { path = "crates/tribal-telemetry" }
tribal-test-utils = { path = "crates/tribal-test-utils" }
