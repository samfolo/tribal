[workspace]
resolver = "3"
members = [
    "crates/tribal-domain",
    "crates/tribal-db",
    "crates/tribal-inference",
    "crates/tribal-worker",
    "crates/tribal-mcp",
    "crates/tribal-telemetry",
    "crates/tribal-server",
    "crates/tribal-test-utils",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.93"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identifiers
uuid = { version = "1", features = ["v4", "serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
tracing-appender = "0.2"

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Builders
typed-builder = "0.23"

# Hashing
fnv = "1"

# Ordered collections
indexmap = "2"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# URL parsing
url = "2"

# Cancellation and utilities
tokio-util = "0.7"

# Concurrent maps
dashmap = "6"

# Async traits
async-trait = "0.1"

# Template rendering
tera = "1"

# JSON Schema generation
schemars = "0.8"

# Testing
tempfile = "3"
testcontainers = "0.27"
wiremock = "0.6"

# Internal crates
tribal-domain = { path = "crates/tribal-domain" }
tribal-db = { path = "crates/tribal-db" }
tribal-inference = { path = "crates/tribal-inference" }
tribal-worker = { path = "crates/tribal-worker" }
tribal-mcp = { path = "crates/tribal-mcp" }
tribal-telemetry = { path = "crates/tribal-telemetry" }
tribal-test-utils = { path = "crates/tribal-test-utils" }
